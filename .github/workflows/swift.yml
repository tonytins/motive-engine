name: Swift

on:
  push:
    branches: [ "main", "rel/**", "release/**" ]
  pull_request:
    branches: [ "main", "rel/**", "release/**" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
