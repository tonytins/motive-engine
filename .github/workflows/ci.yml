name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-benchmark:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"

      - name: Run tests
        run: swift test

      - name: Run performance budgets
        shell: bash
        run: swift run -c release MotiveEngineBenchmarks | tee -a "$GITHUB_STEP_SUMMARY"
